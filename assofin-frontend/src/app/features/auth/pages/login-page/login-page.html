<div class="auth-panel">
  <form class="auth-form">
    @if (mode() === 'login') {
      <app-login-form (requestSignup)="showSignup()"  />
    } @else {
      <app-signup-form (requestLogin)="showLogin()"  />
    }

  </form>
  <img class="panel-img" src="/img/auth-side-image2.png" alt="avatar-1">
</div>
