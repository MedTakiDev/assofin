<form (ngSubmit)="signIn($event)" [formGroup]="loginForm">
  <div class="form-header">
    <h4>Your logo</h4>
    <h3>Login</h3>
  </div>

  <div class="form-fields-container">
    <label for="email">Email</label>
    <p-iconfield>
      <input
        formControlName="email"
        id="email"
        pInputText
        placeholder="username@gmail.com"
        type="email"
        variant="filled"/>
      <p-inputicon>
        <svg data-p-icon="user"/>
      </p-inputicon>
    </p-iconfield>
  </div>

  <div class="form-fields-container">
    <label for="password">Password</label>
    <p-iconfield>
      <input
        [type]="mask() ? 'password' : 'text'"
        formControlName="password"
        id="password"
        pInputPassword
        placeholder="Password"/>

      <p-inputicon (click)="toggleMask()" style="cursor: pointer">
        @if (mask()) {
          <svg data-p-icon="eye"></svg>
        } @else {
          <svg data-p-icon="eye-slash"></svg>
        }
      </p-inputicon>
    </p-iconfield>
    <a href="#">or forget password</a>
  </div>

  <div class="form-fields-container">
    <button
      [disabled]="loginForm.invalid"
      class="large-form-button"
      pButton
      type="submit">
      Sign In
    </button>
  </div>

  <div class="Oauth2">

    <span>Don’t have an account yet? Contact your association administrators</span>

  </div>
</form>
