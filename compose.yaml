services:

  postgres:
    image: postgres:17
    container_name: ${POSTGRES_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - assofin-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

    #  mail-dev: in the production env we should use the actual mail server locally hosted or any online mail server solution this service is used only to test
  mail-dev:
    container_name: ${MAILDEV_CONTAINER_NAME}
    image: maildev/maildev
    ports:
      - "${MAILDEV_UI_PORT}:1080"
      - "${MAILDEV_SMTP_PORT}:1025"
    networks:
      - assofin-network


