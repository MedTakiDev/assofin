# Local development infrastructure. The backend runs on the host, so it reaches these services
# through localhost.
#
# Ports are bound to 127.0.0.1 on purpose: Docker publishes ports past the host firewall, so a port
# without an address would expose the database and the unauthenticated MailDev UI to the network.
services:

  postgres:
    # Exact version, and the Debian release because a new C library can change text sort order in
    # an existing database. Keep in step with TestcontainersConfiguration.
    image: postgres:17.11-trixie
    container_name: ${POSTGRES_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - assofin-network
    healthcheck:
      # -h 127.0.0.1: the first-start initialization runs a temporary server on the Unix socket only,
      # so a check over the socket would report "healthy" before the real server is up.
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

    #  mail-dev: in the production env we should use the actual mail server locally hosted or any online mail server solution this service is used only to test
  mail-dev:
    container_name: ${MAILDEV_CONTAINER_NAME}
    # The image defines its own healthcheck on /healthz.
    image: maildev/maildev:2.2.1
    ports:
      - "127.0.0.1:${MAILDEV_UI_PORT}:1080"
      - "127.0.0.1:${MAILDEV_SMTP_PORT}:1025"
    networks:
      - assofin-network

networks:
  assofin-network:

volumes:
  postgres_data:
