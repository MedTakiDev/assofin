# ==============================================================================
# PRODUCTION PROFILE (application-prod.yml)
# ==============================================================================
# Only what differs from application.yml in production. Secrets have no defaults anywhere, so a
# missing variable stops the application at startup. The full list is in the root README.
spring:
  jpa:
    hibernate:
      ddl-auto: update # Replaced by Flyway migrations and "validate" in PER-01.
    show-sql: true # Turned off in PER-01.
    properties:
      hibernate:
        format_sql: true

application:
  security:
    expose-api-docs: false # Already the default, pinned so production cannot inherit another value.
