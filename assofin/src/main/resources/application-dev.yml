# ==============================================================================
# DEVELOPMENT ENVIRONMENT CONFIGURATION (application-dev.yml)
# ==============================================================================
spring:
  datasource:
    # 'postgres-db' matches the service name defined in your compose.yaml file
    # Internal container port for postgres is always 5432
    url: jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT_MS:2s}

  mail:
    host: ${MAILDEV_HOST}
    port: ${MAILDEV_SMTP_PORT}
    username: ${MAILDEV_USERNAME}
    password: ${MAILDEV_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000