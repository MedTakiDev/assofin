# ==============================================================================
# DEVELOPMENT ENVIRONMENT CONFIGURATION (application-dev.yml)
# ==============================================================================
spring:
  config:
    # Reads the repository-root .env, whether the app starts from the repository root or from
    # assofin/. Only the dev profile does this: production gets real environment variables,
    # which always take precedence over this file.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  docker:
    compose:
      # Start the containers yourself with "docker compose up -d". Otherwise startup fails from
      # assofin/, where there is no compose.yaml. CFG-03 decides whether this dependency stays.
      enabled: false
  datasource:
    # 'postgres-db' matches the service name defined in your compose.yaml file
    # Internal container port for postgres is always 5432
    url: jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

application:
  security:
    expose-api-docs: true # Swagger UI for local development. Never set this in any other profile.
    cookie:
      secure: false # Local development runs on plain HTTP. Never set this in any other profile.
