# ==============================================================================
# DEVELOPMENT PROFILE (application-dev.yml)
# ==============================================================================
# Only what differs from application.yml for local development on plain HTTP.
spring:
  config:
    # Reads the repository-root .env, whether the app starts from the repository root or from
    # assofin/. Only the dev profile does this: production gets real environment variables,
    # which always take precedence over this file.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  jpa:
    hibernate:
      ddl-auto: update # Replaced by Flyway migrations in PER-01.
    show-sql: true
    properties:
      hibernate:
        format_sql: true

application:
  security:
    expose-api-docs: true # Swagger UI for local development. Never set this in any other profile.
    cookie:
      # Local development runs on plain HTTP, which the __Host- prefix and Secure forbid.
      # Never set these in any other profile.
      name: access_token
      secure: false
