# ==============================================================================
# GLOBAL CONFIGURATION (Loaded for all profiles)
# ==============================================================================
spring:
  application:
    name: assofin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev} # Defaults to 'dev' if not in .env
  # Spring Boot's fallback /error body (errors that never reach GlobalExceptionHandler).
  # These are the defaults, pinned on purpose so no profile can start leaking internals.
  # Boot 4 moved these keys from server.error.* to spring.web.error.* (the old ones are ignored).
  web:
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never
      include-exception: false
      whitelabel:
        enabled: false

# Global security attributes
application:
  cors:
    allowed-origins:
      - "http://localhost:4200"
      - "https://your-production-domain.com"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
      - "PATCH"
    allowed-headers:
      - "Authorization"
      - "Content-Type"
      - "X-Requested-With"
      - "Accept"
    exposed-headers:
      - "Authorization"
    max-age: 3600
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: ${JWT_EXPIRATION_MS}
  # Default administrator, created at startup only while no user holds the ADMIN role.
  # Empty defaults keep startup working once an admin exists; if no admin exists and these are
  # empty, AdminUserInitializer stops the application with an explicit message.
  bootstrap:
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
      firstname: ${ADMIN_FIRSTNAME:System}
      lastname: ${ADMIN_LASTNAME:Administrator}

server:
  servlet:
    context-path: /api/v1/
