# ==============================================================================
# GLOBAL CONFIGURATION (Loaded for all profiles)
# ==============================================================================
spring:
  application:
    name: assofin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev} # Defaults to 'dev' if not in .env

# Global security attributes
application:
  cors:
    allowed-origins:
      - "http://localhost:4200"
      - "https://your-production-domain.com"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
      - "PATCH"
    allowed-headers:
        - "Authorization"
        - "Content-Type"
        - "X-Requested-With"
        - "Accept"
    exposed-headers:
        - "Authorization"
    max-age: 3600
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: ${JWT_EXPIRATION_MS}
  frontend:
    activation-url: ${FRONTEND_ACTIVATION_URL}

server:
  servlet:
    context-path: /api/v1/
