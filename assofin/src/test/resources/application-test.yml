# ==============================================================================
# TEST PROFILE (used with @ActiveProfiles("test") + TestcontainersConfiguration)
# Every value below is a test-only fixture, never a real secret. Tests need no .env.
# ==============================================================================
spring:
  # The real connection comes from the Testcontainers @ServiceConnection, which takes precedence.
  # These values only replace the ${POSTGRES_*} placeholders of application.yml.
  datasource:
    url: jdbc:postgresql://replaced-by-testcontainers/test
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: create-drop
  mail:
    host: localhost
    port: 1025

application:
  cors:
    allowed-origins: http://localhost:4200
  security:
    jwt:
      # Base64 of a 32-byte test-only key
      secret-key: dGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LTMyLWJ5dGVzISE=
      expiration: 1h
  mail:
    from: no-reply@test.local
  bootstrap:
    admin:
      email: Admin@Test.Local
      password: test-admin-password
